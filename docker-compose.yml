services:
  mcp-server:
    build: .
    container_name: mcp-ticket-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mcp-ngrok
    profiles:
      - ngrok
    restart: unless-stopped
    depends_on:
      - mcp-server
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "mcp-server:3000", "--log=stdout"]
    ports:
      - "4040:4040"
