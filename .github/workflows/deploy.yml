name: Deploy MCP Ticket su container Proxmox

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # clean: false preserva .env e eventuali dati gitignored tra un deploy e l'altro
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ripristina .env dai secret
        run: cp /opt/secrets/mcp-ticket.env .env

      - name: Build e avvio
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Stato servizi
        run: docker compose ps
